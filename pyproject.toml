[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fixprop"
version = "0.1.0"
description = "Find bug fixes that were never carried over to copied embedded driver code (see README.md)"
requires-python = ">=3.10"
dependencies = [
  "tomli==2.5.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixprop = ["review.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
